<!DOCTYPE html>
<!-- original:https://codepen.io/boudra/pen/raErwP -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <style>
        :root {
            --accent: #d8a4ed;
            --accent-hover: #e8c7f4;
            --accent-deep: #c98ce4;

            --bg: #ffffff;
            --surface: #ffffff;
            --surface-alt: #faf7fc;
            --text: #4b4453;
            --muted: #9a90a3;
            --line: rgba(0, 0, 0, 0.08);
            --shadow: 0 8px 24px rgba(109, 74, 126, 0.10);
            --today-text: #ffffff;
            --button-bg: rgba(255, 255, 255, 0.32);
            --button-bg-hover: rgba(255, 255, 255, 0.5);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1f1f1f;
                --surface: #2a2a2a;
                --surface-alt: #323232;
                --text: #ece7f2;
                --muted: #b9aeca;
                --line: rgba(255, 255, 255, 0.08);
                --shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
                --today-text: #ffffff;
                --button-bg: rgba(255, 255, 255, 0.14);
                --button-bg-hover: rgba(255, 255, 255, 0.24);
            }
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
        }

        body {
            font-family: 'Arial', sans-serif;
            color: var(--text);
        }

        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button::-moz-focus-inner {
            border: 0;
            padding: 0;
        }

        #calendari {
            margin: 0 auto;
            font-size: 14px;
            position: relative;
            width: 100%;
            max-width: 360px;
            min-height: 330px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            background-color: var(--surface);
            box-shadow: var(--shadow);
            border-radius: 18px;
            overflow: hidden;
            position: absolute;
            left: 0;
            top: 0;
        }

        td, th {
            text-align: center;
            background-color: var(--surface);
        }

        th {
            padding: 10px;
        }

        tr:first-child th {
            font-size: 20px;
            font-weight: bold;
            border: none;
            background: var(--accent);
            color: #fff;
            position: relative;
            padding: 16px 42px 14px;
        }

        tr:first-child .any {
            font-size: 12px;
            font-weight: normal;
            display: block;
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.86);
        }

        tr:nth-child(2) th {
            padding: 8px 5px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.02em;
            color: var(--muted);
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 0;
            border-bottom: 1px solid var(--line);
            border-right: 1px solid var(--line);
            background: var(--surface);
        }

        td:last-child,
        th:last-child {
            border-right: none;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td > span {
            color: var(--text);
            padding: 12px 8px;
            display: block;
            border: 2px solid transparent;
            transition:
                background-color 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease,
                transform 0.2s ease;
            border-radius: 10px;
            margin: 3px;
        }

        td:nth-child(even) > span {
            background-color: var(--surface-alt);
        }

        td:last-child > span,
        td:nth-child(6) > span {
            color: var(--accent-deep);
        }

        td.avui > span {
            font-weight: bold;
            background-color: var(--accent);
            color: var(--today-text);
            border: 2px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 3px 8px rgba(216, 164, 237, 0.28);
        }

        td.fora > span {
            opacity: 0.28;
        }

        td > span:hover {
            background: var(--accent-hover);
            color: #fff;
            transform: translateY(-1px);
        }

        .boto-next,
        .boto-prev {
            background: var(--button-bg);
            color: #fff;
            font-family: inherit;
            border: none;
            font-size: 16px;
            font-weight: bold;
            text-shadow: none;
            padding: 0;
            line-height: 1;
            height: 30px;
            width: 30px;
            border-radius: 999px;
            position: absolute;
            top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .boto-next {
            right: 12px;
        }

        .boto-prev {
            left: 12px;
        }

        .boto-next:hover,
        .boto-prev:hover {
            background: var(--button-bg-hover);
            transform: scale(1.05);
            cursor: pointer;
        }

        button:focus {
            outline: none;
        }

        footer {
            text-align: center;
            color: #ddd;
            font-weight: normal;
            text-shadow: 0px -1px 0px rgba(0, 0, 0, 0.2);
            font-size: 0.8em;
            padding: 20px;
        }

        footer a,
        footer a:link {
            color: #fff;
            text-decoration: none;
        }

        /* animation classes from original logic */
        .actiu {
            opacity: 1;
            transform: translateX(0);
            transition: all 0.35s ease;
            z-index: 2;
        }

        .inactiu {
            opacity: 0;
            transition: all 0.35s ease;
            z-index: 1;
        }

        .amagat-esquerra {
            transform: translateX(-18px);
            opacity: 0;
        }

        .amagat-dreta {
            transform: translateX(18px);
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="calendari"></div>
    </div>

    <script>
        var mesos = [
            'January',
            'February',
            'March',
            'April',
            'May',
            'June',
            'July',
            'August',
            'September',
            'October',
            'November',
            'December'
        ];

        var dies = [
            'Sunday',
            'Monday',
            'Tuesday',
            'Wedensday',
            'Thursday',
            'Friday',
            'Saturday'
        ];

        var dies_abr = [
            'Su',
            'Mo',
            'Tu',
            'We',
            'Th',
            'Fr',
            'Sa'
        ];

        Number.prototype.pad = function(num) {
            var str = '';
            for (var i = 0; i < (num - this.toString().length); i++) {
                str += '0';
            }
            return str += this.toString();
        };

        function calendari(widget, data) {
            var original = widget.getElementsByClassName('actiu')[0];

            if (typeof original === 'undefined') {
                original = document.createElement('table');
                original.setAttribute(
                    'data-actual',
                    data.getFullYear() + '/' +
                    data.getMonth().pad(2) + '/' +
                    data.getDate().pad(2)
                );
                widget.appendChild(original);
            }

            var diff = data - new Date(original.getAttribute('data-actual'));
            diff = new Date(diff).getMonth();

            var e = document.createElement('table');
            e.className = diff === 0 ? 'amagat-esquerra' : 'amagat-dreta';
            e.innerHTML = '';

            widget.appendChild(e);

            e.setAttribute(
                'data-actual',
                data.getFullYear() + '/' +
                data.getMonth().pad(2) + '/' +
                data.getDate().pad(2)
            );

            var fila = document.createElement('tr');
            var titol = document.createElement('th');
            titol.setAttribute('colspan', 7);

            var boto_prev = document.createElement('button');
            boto_prev.className = 'boto-prev';
            boto_prev.innerHTML = '&#9666;';

            var boto_next = document.createElement('button');
            boto_next.className = 'boto-next';
            boto_next.innerHTML = '&#9656;';

            titol.appendChild(boto_prev);
            titol.appendChild(document.createElement('span')).innerHTML =
                mesos[data.getMonth()] + '<span class="any">' + data.getFullYear() + '</span>';
            titol.appendChild(boto_next);

            boto_prev.onclick = function() {
                data.setMonth(data.getMonth() - 1);
                calendari(widget, data);
            };

            boto_next.onclick = function() {
                data.setMonth(data.getMonth() + 1);
                calendari(widget, data);
            };

            fila.appendChild(titol);
            e.appendChild(fila);

            fila = document.createElement('tr');

            for (var i = 1; i < 7; i++) {
                fila.innerHTML += '<th>' + dies_abr[i] + '</th>';
            }

            fila.innerHTML += '<th>' + dies_abr[0] + '</th>';
            e.appendChild(fila);

            var inici_mes =
                new Date(data.getFullYear(), data.getMonth(), -1).getDay();

            var actual = new Date(
                data.getFullYear(),
                data.getMonth(),
                -inici_mes
            );

            for (var s = 0; s < 6; s++) {
                var fila = document.createElement('tr');

                for (var d = 1; d < 8; d++) {
                    var cela = document.createElement('td');
                    var span = document.createElement('span');

                    cela.appendChild(span);
                    span.innerHTML = actual.getDate();

                    if (actual.getMonth() !== data.getMonth()) {
                        cela.className = 'fora';
                    }

                    if (
                        data.getDate() == actual.getDate() &&
                        data.getMonth() == actual.getMonth()
                    ) {
                        cela.className = 'avui';
                    }

                    actual.setDate(actual.getDate() + 1);
                    fila.appendChild(cela);
                }

                e.appendChild(fila);
            }

            setTimeout(function() {
                e.className = 'actiu';
                original.className += diff === 0 ? ' amagat-dreta' : ' amagat-esquerra';
            }, 20);

            original.className = 'inactiu';

            setTimeout(function() {
                var inactius = document.getElementsByClassName('inactiu');
                for (var i = 0; i < inactius.length; i++) {
                    widget.removeChild(inactius[i]);
                }
            }, 1000);
        }

        calendari(document.getElementById('calendari'), new Date());
    </script>
</body>
</html>
