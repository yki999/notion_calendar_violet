<!DOCTYPE html>
<!-- original:https://codepen.io/boudra/pen/raErwP -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <style>
        :root {
            --accent: #d8a4ed;
            --accent-soft: #efd8f8;
            --accent-hover: #e8c7f4;
            --accent-deep: #c98ce4;

            --holiday: #e98aa8;
            --holiday-soft: #fde8ef;

            --bg: #ffffff;
            --surface: #ffffff;
            --text: #5a4d61;
            --muted: #a590af;
            --line: rgba(0, 0, 0, 0.07);
            --shadow: 0 8px 24px rgba(168, 122, 190, 0.12);
            --today-text: #ffffff;
            --button-bg: rgba(255, 255, 255, 0.30);
            --button-bg-hover: rgba(255, 255, 255, 0.50);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1f1f1f;
                --surface: #2a2a2a;
                --text: #f1e9f5;
                --muted: #bfaec8;
                --line: rgba(255, 255, 255, 0.08);
                --shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
                --button-bg: rgba(255, 255, 255, 0.14);
                --button-bg-hover: rgba(255, 255, 255, 0.24);
                --holiday-soft: rgba(233, 138, 168, 0.16);
            }
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
        }

        body {
            font-family: "Arial", sans-serif;
            color: var(--text);
        }

        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-sizing: border-box;
        }

        button::-moz-focus-inner {
            border: 0;
            padding: 0;
        }

        #calendari {
            margin: 0 auto;
            font-size: 13px;
            position: relative;
            width: 100%;
            max-width: 340px;
            min-height: 278px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            background-color: var(--surface);
            box-shadow: var(--shadow);
            border-radius: 20px;
            overflow: hidden;
            position: absolute;
            left: 0;
            top: 0;
        }

        td, th {
            text-align: center;
            background-color: var(--surface);
        }

        tr:first-child th {
            font-size: 19px;
            font-weight: bold;
            border: none;
            background: linear-gradient(180deg, #e7c6f3 0%, #d8a4ed 100%);
            color: #fff;
            position: relative;
            padding: 13px 40px 11px;
        }

        tr:first-child .any {
            font-size: 11px;
            font-weight: normal;
            display: block;
            margin-top: 3px;
            color: rgba(255, 255, 255, 0.88);
            letter-spacing: 0.02em;
        }

        tr:nth-child(2) th {
            padding: 6px 4px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.03em;
            color: var(--muted);
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 0;
            border-bottom: 1px solid var(--line);
            border-right: 1px solid var(--line);
            background: var(--surface);
        }

        td:last-child,
        th:last-child {
            border-right: none;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td > span {
            color: var(--text);
            padding: 9px 6px;
            display: block;
            border: 1px solid transparent;
            transition:
                background-color 0.22s ease,
                color 0.22s ease,
                border-color 0.22s ease,
                transform 0.18s ease;
            border-radius: 10px;
            margin: 2px;
            line-height: 1.15;
        }

        /* 偶数列の薄い背景を削除して、全曜日を同じ見た目に */
        td:nth-child(even) > span {
            background-color: transparent;
        }

        td:last-child > span,
        td:nth-child(6) > span {
            color: var(--accent-deep);
        }

        td.avui > span {
            font-weight: bold;
            background-color: var(--accent);
            color: var(--today-text);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 10px rgba(216, 164, 237, 0.28);
        }

        td.holiday > span {
            color: var(--holiday);
            font-weight: bold;
            background: var(--holiday-soft);
        }

        td.holiday.avui > span {
            background: linear-gradient(180deg, #e9b7ca 0%, var(--holiday) 100%);
            color: #fff;
            box-shadow: 0 4px 10px rgba(233, 138, 168, 0.28);
        }

        td.fora > span {
            opacity: 0.22;
        }

        td > span:hover {
            background: var(--accent-hover);
            color: #fff;
            transform: translateY(-1px);
        }

        .boto-next,
        .boto-prev {
            background: var(--button-bg);
            color: #fff;
            font-family: inherit;
            border: none;
            font-size: 15px;
            font-weight: bold;
            padding: 0;
            line-height: 1;
            height: 28px;
            width: 28px;
            border-radius: 999px;
            position: absolute;
            top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .boto-next {
            right: 12px;
        }

        .boto-prev {
            left: 12px;
        }

        .boto-next:hover,
        .boto-prev:hover {
            background: var(--button-bg-hover);
            transform: scale(1.05);
            cursor: pointer;
        }

        button:focus {
            outline: none;
        }

        .actiu {
            opacity: 1;
            transform: translateX(0);
            transition: all 0.35s ease;
            z-index: 2;
        }

        .inactiu {
            opacity: 0;
            transition: all 0.35s ease;
            z-index: 1;
        }

        .amagat-esquerra {
            transform: translateX(-14px);
            opacity: 0;
        }

        .amagat-dreta {
            transform: translateX(14px);
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="calendari"></div>
    </div>

    <script>
        var mesos = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        var dies_abr = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

        Number.prototype.pad = function(num) {
            var str = '';
            for (var i = 0; i < (num - this.toString().length); i++) str += '0';
            return str += this.toString();
        };

        /* 2026-2027 Japanese holidays */
        var holidays = {
            "2026-01-01": "New Year's Day",
            "2026-01-12": "Coming of Age Day",
            "2026-02-11": "National Foundation Day",
            "2026-02-23": "Emperor's Birthday",
            "2026-03-20": "Vernal Equinox Day",
            "2026-04-29": "Showa Day",
            "2026-05-03": "Constitution Memorial Day",
            "2026-05-04": "Greenery Day",
            "2026-05-05": "Children's Day",
            "2026-05-06": "Holiday",
            "2026-07-20": "Marine Day",
            "2026-08-11": "Mountain Day",
            "2026-09-21": "Respect for the Aged Day",
            "2026-09-22": "Holiday",
            "2026-09-23": "Autumnal Equinox Day",
            "2026-10-12": "Sports Day",
            "2026-11-03": "Culture Day",
            "2026-11-23": "Labor Thanksgiving Day",

            "2027-01-01": "New Year's Day",
            "2027-01-11": "Coming of Age Day",
            "2027-02-11": "National Foundation Day",
            "2027-02-23": "Emperor's Birthday",
            "2027-03-21": "Vernal Equinox Day",
            "2027-03-22": "Holiday",
            "2027-04-29": "Showa Day",
            "2027-05-03": "Constitution Memorial Day",
            "2027-05-04": "Greenery Day",
            "2027-05-05": "Children's Day",
            "2027-07-19": "Marine Day",
            "2027-08-11": "Mountain Day",
            "2027-09-20": "Respect for the Aged Day",
            "2027-09-23": "Autumnal Equinox Day",
            "2027-10-11": "Sports Day",
            "2027-11-03": "Culture Day",
            "2027-11-23": "Labor Thanksgiving Day"
        };

        function formatDateKey(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function isHoliday(date) {
            return holidays.hasOwnProperty(formatDateKey(date));
        }

        function calendari(widget, data) {
            var original = widget.getElementsByClassName('actiu')[0];

            if (typeof original === 'undefined') {
                original = document.createElement('table');
                original.setAttribute(
                    'data-actual',
                    data.getFullYear() + '/' +
                    data.getMonth().pad(2) + '/' +
                    data.getDate().pad(2)
                );
                widget.appendChild(original);
            }

            var diff = data - new Date(original.getAttribute('data-actual'));
            diff = new Date(diff).getMonth();

            var e = document.createElement('table');
            e.className = diff === 0 ? 'amagat-esquerra' : 'amagat-dreta';
            e.innerHTML = '';

            widget.appendChild(e);

            e.setAttribute(
                'data-actual',
                data.getFullYear() + '/' +
                data.getMonth().pad(2) + '/' +
                data.getDate().pad(2)
            );

            var fila = document.createElement('tr');
            var titol = document.createElement('th');
            titol.setAttribute('colspan', 7);

            var boto_prev = document.createElement('button');
            boto_prev.className = 'boto-prev';
            boto_prev.innerHTML = '&#9666;';

            var boto_next = document.createElement('button');
            boto_next.className = 'boto-next';
            boto_next.innerHTML = '&#9656;';

            titol.appendChild(boto_prev);
            titol.appendChild(document.createElement('span')).innerHTML =
                mesos[data.getMonth()] + '<span class="any">' + data.getFullYear() + '</span>';
            titol.appendChild(boto_next);

            boto_prev.onclick = function() {
                data.setMonth(data.getMonth() - 1);
                calendari(widget, data);
            };

            boto_next.onclick = function() {
                data.setMonth(data.getMonth() + 1);
                calendari(widget, data);
            };

            fila.appendChild(titol);
            e.appendChild(fila);

            fila = document.createElement('tr');
            for (var i = 1; i < 7; i++) {
                fila.innerHTML += '<th>' + dies_abr[i] + '</th>';
            }
            fila.innerHTML += '<th>' + dies_abr[0] + '</th>';
            e.appendChild(fila);

            var inici_mes = new Date(data.getFullYear(), data.getMonth(), -1).getDay();
            var actual = new Date(data.getFullYear(), data.getMonth(), -inici_mes);

            for (var s = 0; s < 6; s++) {
                var fila = document.createElement('tr');

                for (var d = 1; d < 8; d++) {
                    var cela = document.createElement('td');
                    var span = document.createElement('span');
                    cela.appendChild(span);

                    span.innerHTML = actual.getDate();

                    var classes = [];

                    if (actual.getMonth() !== data.getMonth()) {
                        classes.push('fora');
                    }

                    if (
                        data.getDate() == actual.getDate() &&
                        data.getMonth() == actual.getMonth() &&
                        data.getFullYear() == actual.getFullYear()
                    ) {
                        classes.push('avui');
                    }

                    if (isHoliday(actual)) {
                        classes.push('holiday');
                        span.title = holidays[formatDateKey(actual)];
                    }

                    cela.className = classes.join(' ');

                    actual.setDate(actual.getDate() + 1);
                    fila.appendChild(cela);
                }

                e.appendChild(fila);
            }

            setTimeout(function() {
                e.className = 'actiu';
                original.className += diff === 0 ? ' amagat-dreta' : ' amagat-esquerra';
            }, 20);

            original.className = 'inactiu';

            setTimeout(function() {
                var inactius = document.getElementsByClassName('inactiu');
                for (var i = 0; i < inactius.length; i++) {
                    widget.removeChild(inactius[i]);
                }
            }, 1000);
        }

        calendari(document.getElementById('calendari'), new Date());
    </script>
</body>
</html>
