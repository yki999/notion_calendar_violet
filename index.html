<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
--accent:#b795ff;
--accent-soft:#e6dbff;
--accent-deep:#9a73f2;

--holiday:#df8cab;
--holiday-soft:#fdeaf1;

--text:#5a4d61;
--muted:#9c8fb3;
--line:rgba(0,0,0,0.08);

--shadow:0 6px 18px rgba(146,111,214,0.10);
}

body{
margin:0;
font-family:'Playfair Display',serif;
color:var(--text);
background:transparent;
}

.wrapper{
display:flex;
justify-content:center;
padding:6px;
}

#calendari{
width:100%;
max-width:420px;
aspect-ratio:1/1;
position:relative;
font-size:clamp(13px,1.3vw,16px);
}

table{
width:100%;
height:100%;
border-collapse:separate;
border-spacing:0;
background:#fff;
box-shadow:var(--shadow);
border-radius:3px;
overflow:hidden;
position:absolute;
}

td,th{
text-align:center;
}

tr:first-child th{
background:linear-gradient(180deg,#d9c8ff,#b795ff);
color:white;
padding:12px 40px 10px;
font-size:1.25em;
letter-spacing:.03em;
}

tr:first-child .any{
display:block;
font-size:.85em;
margin-top:2px;
opacity:.9;
}

tr:nth-child(2) th{
font-size:.7em;
letter-spacing:.06em;
padding:6px 4px;
color:var(--muted);
border-bottom:1px solid var(--line);
}

td{
border-right:1px solid var(--line);
border-bottom:1px solid var(--line);
}

td:last-child,th:last-child{
border-right:none;
}

td span{
display:flex;
align-items:center;
justify-content:center;
height:100%;
padding:10px 0;
}

td.avui span{
background:var(--accent);
color:white;
width:28px;
height:28px;
border-radius:50%;
margin:auto;
box-shadow:0 2px 6px rgba(183,149,255,.35);
}

td.holiday span{
color:var(--holiday);
background:var(--holiday-soft);
border-radius:6px;
}

td.fora span{
opacity:.2;
}

.boto-next,.boto-prev{
position:absolute;
top:10px;
width:24px;
height:24px;
border-radius:50%;
border:none;
background:rgba(255,255,255,.25);
color:white;
font-weight:bold;
cursor:pointer;
}

.boto-prev{left:10px}
.boto-next{right:10px}

.actiu{opacity:1;transition:.35s}
.inactiu{opacity:0;transition:.35s}

</style>
</head>

<body>

<div class="wrapper">
<div id="calendari"></div>
</div>

<script>

let holidays={}

/* 日本の祝日を自動取得 */
fetch("https://holidays-jp.github.io/api/v1/date.json")
.then(res=>res.json())
.then(data=>{
holidays=data
})

const mesos=[
'January','February','March','April','May','June',
'July','August','September','October','November','December'
]

const dies_abr=['Su','Mo','Tu','We','Th','Fr','Sa']

Number.prototype.pad=function(num){
let str=''
for(let i=0;i<(num-this.toString().length);i++)str+='0'
return str+=this.toString()
}

function formatDateKey(date){
let y=date.getFullYear()
let m=String(date.getMonth()+1).padStart(2,'0')
let d=String(date.getDate()).padStart(2,'0')
return y+"-"+m+"-"+d
}

function isHoliday(date){
return holidays[formatDateKey(date)]
}

function calendari(widget,data){

let original=widget.getElementsByClassName('actiu')[0]

if(!original){
original=document.createElement('table')
original.setAttribute('data-actual',
data.getFullYear()+'/'+
data.getMonth().pad(2)+'/'+
data.getDate().pad(2))
widget.appendChild(original)
}

let diff=data-new Date(original.getAttribute('data-actual'))
diff=new Date(diff).getMonth()

let e=document.createElement('table')
e.className=diff===0?'amagat-esquerra':'amagat-dreta'

widget.appendChild(e)

e.setAttribute('data-actual',
data.getFullYear()+'/'+
data.getMonth().pad(2)+'/'+
data.getDate().pad(2))

let fila=document.createElement('tr')
let titol=document.createElement('th')
titol.setAttribute('colspan',7)

let prev=document.createElement('button')
prev.className='boto-prev'
prev.innerHTML='‹'

let next=document.createElement('button')
next.className='boto-next'
next.innerHTML='›'

titol.appendChild(prev)
titol.appendChild(document.createElement('span')).innerHTML=
mesos[data.getMonth()]+'<span class="any">'+data.getFullYear()+'</span>'
titol.appendChild(next)

prev.onclick=function(){
data.setMonth(data.getMonth()-1)
calendari(widget,data)
}

next.onclick=function(){
data.setMonth(data.getMonth()+1)
calendari(widget,data)
}

fila.appendChild(titol)
e.appendChild(fila)

fila=document.createElement('tr')

for(let i=1;i<7;i++)
fila.innerHTML+='<th>'+dies_abr[i]+'</th>'

fila.innerHTML+='<th>'+dies_abr[0]+'</th>'
e.appendChild(fila)

let inici_mes=new Date(data.getFullYear(),data.getMonth(),-1).getDay()

let actual=new Date(data.getFullYear(),data.getMonth(),-inici_mes)

for(let s=0;s<6;s++){

let fila=document.createElement('tr')

for(let d=1;d<8;d++){

let cela=document.createElement('td')
let span=document.createElement('span')

cela.appendChild(span)

span.innerHTML=actual.getDate()

let classes=[]

if(actual.getMonth()!==data.getMonth())
classes.push('fora')

if(
data.getDate()==actual.getDate() &&
data.getMonth()==actual.getMonth() &&
data.getFullYear()==actual.getFullYear()
)
classes.push('avui')

if(isHoliday(actual))
classes.push('holiday')

cela.className=classes.join(' ')

actual.setDate(actual.getDate()+1)

fila.appendChild(cela)

}

e.appendChild(fila)

}

setTimeout(()=>{
e.className='actiu'
original.className+=' inactiu'
},20)

setTimeout(()=>{
let inactius=document.getElementsByClassName('inactiu')
for(let i=0;i<inactius.length;i++)
widget.removeChild(inactius[i])
},300)

}

calendari(document.getElementById('calendari'),new Date())

</script>

</body>
</html>
