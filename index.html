<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  color-scheme: light dark;
  --accent:#b795ff;
  --accent-soft:#e6dbff;
  --accent-deep:#9a73f2;
  --holiday:#df8cab;
  --saturday:#9a73f2;
  --text:#5a4d61;
  --muted:#9c8fb3;
  --line:rgba(0,0,0,0.08);
  --shadow:0 6px 18px rgba(146,111,214,0.10);
  --header-grad-1:#d9c8ff;
  --header-grad-2:#b795ff;
  --table-bg: #ffffff;
}

@media (prefers-color-scheme: dark){
  :root{
    --text:#f1e9f5;
    --muted:#c4b7d6;
    --line:rgba(255,255,255,0.08);
    --shadow:none;
    --header-grad-1:#c8b0ff;
    --header-grad-2:#b795ff;
    --table-bg: #191919; 
  }
}

html,body{
  margin:0;
  padding:0;
  height: 100%; 
  /* GitHub上でも箱が見えるよう、bodyには極薄の背景を置きますが、Notionでは透明に見えます */
  background-color: rgba(128, 128, 128, 0.01);
  overflow: hidden;
}

body{
  font-family:'Playfair Display', serif;
  color:var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
}

.wrapper{
  display:flex;
  justify-content:center;
  align-items: center;
  width: 100%;
  height: 100%;
}

#calendari{
  width: 95%;
  max-width: 399px; /* 全体95%縮小 */
  aspect-ratio:1/1;
  position:relative;
  font-size:clamp(13px,1.25vw,16px);
}

table{
  width:100%;
  height:100%;
  border-collapse:separate;
  border-spacing:0;
  table-layout:fixed;
  box-shadow:var(--shadow);
  background-color: var(--table-bg);
  border-radius:3px; /* 角丸を元の3pxに復元 */
  overflow:hidden;
  position:absolute;
  inset:0;
}

td,th{
  text-align:center;
}

tr:first-child th{
  background:linear-gradient(180deg,var(--header-grad-1),var(--header-grad-2));
  color:#fff;
  padding:12px 40px 10px;
  font-size:1.25em;
  letter-spacing:.03em;
  border:none;
  position:relative;
  font-weight:600;
}

tr:first-child .any{
  display:block;
  font-size:1em;
  margin-top:2px;
  opacity:.92;
  line-height:1.1;
}

tr:nth-child(2) th{
  font-size:.7em;
  letter-spacing:.06em;
  padding:6px 4px;
  color:var(--muted);
  border-bottom:1px solid var(--line);
  font-weight:600;
}

tr:nth-child(2) th:nth-child(6){ color:var(--saturday); }
tr:nth-child(2) th:nth-child(7){ color:var(--holiday); }

td{
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  vertical-align:middle;
  padding:0;
}

td:last-child, th:last-child{ border-right:none; }
tr:last-child td{ border-bottom:none; }

td>span{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:44px;
}

td.saturday>span{ color:var(--saturday); }
td.sunday>span{ color:var(--holiday); }

/* --- 修正：本日の正円を死守 --- */
td.avui>span{
  width:32px;
  height:32px;
  min-width:32px; /* 楕円化防止 */
  min-height:32px; /* 楕円化防止 */
  flex-shrink: 0;  /* 楕円化防止 */
  margin: auto;
  background:var(--accent);
  color:#fff;
  border-radius:50%; /* ここは50%で正円 */
  box-shadow:0 2px 6px rgba(183,149,255,.35);
}

td.holiday>span{ color:var(--holiday); font-weight:600; }
td.holiday.avui>span{ color:#fff; background:var(--accent); }
td.fora>span{ opacity:.2; }

.boto-next, .boto-prev{
  position:absolute;
  top:10px;
  width:24px;
  height:24px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.25);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index: 10;
}

.boto-prev{ left:10px; }
.boto-next{ right:10px; }

</style>
</head>

<body>
<div class="wrapper">
  <div id="calendari"></div>
</div>

<script>
let holidays={}
fetch("https://holidays-jp.github.io/api/v1/date.json")
.then(res=>res.json())
.then(data=>{
  holidays=data
  calendari(document.getElementById('calendari'),new Date())
})
.catch(()=> calendari(document.getElementById('calendari'),new Date()))

const mesos=['January','February','March','April','May','June','July','August','September','October','November','December']
const dies_abr=['Su','Mo','Tu','We','Th','Fr','Sa']

function formatDateKey(date){
  return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,'0')+"-"+String(date.getDate()).padStart(2,'0')
}

function calendari(widget,data){
  widget.innerHTML=''
  const e=document.createElement('table')
  widget.appendChild(e)

  let fila=document.createElement('tr')
  const titol=document.createElement('th')
  titol.setAttribute('colspan',7)

  const prev=document.createElement('button'); prev.className='boto-prev'; prev.innerHTML='‹'
  const next=document.createElement('button'); next.className='boto-next'; next.innerHTML='›'

  titol.appendChild(prev)
  titol.appendChild(document.createElement('span')).innerHTML= mesos[data.getMonth()]+'<span class="any">'+data.getFullYear()+'</span>'
  titol.appendChild(next)

  prev.onclick=()=> { data.setMonth(data.getMonth()-1); calendari(widget,data); }
  next.onclick=()=> { data.setMonth(data.getMonth()+1); calendari(widget,data); }

  fila.appendChild(titol); e.appendChild(fila)

  fila=document.createElement('tr')
  for(let i=1;i<7;i++){ fila.innerHTML+='<th>'+dies_abr[i]+'</th>' }
  fila.innerHTML+='<th>'+dies_abr[0]+'</th>'
  e.appendChild(fila)

  const firstDay = new Date(data.getFullYear(), data.getMonth(), 1)
  let startDay = firstDay.getDay()
  if (startDay === 0) startDay = 7 
  
  let actual = new Date(data.getFullYear(), data.getMonth(), 2 - startDay)
  const today = new Date()

  for(let s=0;s<6;s++){
    const filaSetmana=document.createElement('tr')
    for(let d=1;d<8;d++){
      const cela=document.createElement('td')
      const span=document.createElement('span')
      cela.appendChild(span)
      span.textContent=actual.getDate()

      if(actual.getMonth()!==data.getMonth()) cela.classList.add('fora')
      if(formatDateKey(today)===formatDateKey(actual)) cela.classList.add('avui')
      if(d===6) cela.classList.add('saturday')
      if(d===7) cela.classList.add('sunday')
      if(holidays[formatDateKey(actual)]) cela.classList.add('holiday')

      actual.setDate(actual.getDate()+1)
      filaSetmana.appendChild(cela)
    }
    e.appendChild(filaSetmana)
  }
}
</script>
</body>
</html>
