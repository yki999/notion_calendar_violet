<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  /* Notionのダークモードで透明背景を有効にする魔法の1行 */
  color-scheme: light dark;

  --accent:#b795ff;
  --accent-soft:#e6dbff;
  --accent-deep:#9a73f2;

  --holiday:#df8cab;
  --saturday:#9a73f2;

  --text:#5a4d61;
  --muted:#9c8fb3;
  --line:rgba(0,0,0,0.08);

  --shadow:0 6px 18px rgba(146,111,214,0.10);

  --header-grad-1:#d9c8ff;
  --header-grad-2:#b795ff;
}

@media (prefers-color-scheme: dark){
  :root{
    --text:#f1e9f5;
    --muted:#c4b7d6;
    --line:rgba(255,255,255,0.08);

    --shadow:none;

    --header-grad-1:#c8b0ff;
    --header-grad-2:#b795ff;
  }
}

html,body{
  margin:0;
  padding:0;
  /* 上下左右中央揃えの起点となる高さ */
  height: 100vh; 
  /* 背景を完全に透明に */
  background-color: transparent;
  overflow: hidden;
}

body{
  font-family:'Playfair Display', serif;
  color:var(--text);
  /* 全体余白の起点を上下左右中央揃えに */
  display: flex;
  justify-content: center;
  align-items: center;
}

.wrapper{
  display:flex;
  justify-content:center;
  align-items: center;
  width: 100%;
  padding:6px;
  box-sizing:border-box;
}

#calendari{
  /* フォントサイズは変えずに、全体の枠組みを95%に縮小 */
  width: 95%;
  max-width: 399px; /* 元の420pxの約95% */

  aspect-ratio:1/1;
  position:relative;
  /* フォントサイズは元のまま維持 */
  font-size:clamp(13px,1.25vw,16px);
}

table{
  width:100%;
  height:100%;
  border-collapse:separate;
  border-spacing:0;
  table-layout:fixed;
  box-shadow:var(--shadow);
  border-radius:3px;
  overflow:hidden;
